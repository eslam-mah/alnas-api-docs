openapi: 3.0.3
info:
  title: Al Nas Hospital HR API
  description: HR system API for authentication, user management, roster, and excuses
  version: 1.4.0

servers:
  - url: https://172.16.255.15/alnashospital/hr_api
    description: Internal Hospital Network

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          example: 1235813213455

    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
          example: 1235813213455
        new_password:
          type: string
          example: 123

    UserMeResponse:
      type: object
      properties:
        status:
          type: boolean
          example: true
        data:
          type: object
          properties:
            id:
              type: integer
              example: 84
            username:
              type: string
              example: "975"
            display_name:
              type: string
              example: "Esraa abdelrahman Hassanin"
            role:
              type: string
              example: department_super
            employee_id:
              type: integer
              example: 160
            employee_number:
              type: integer
              example: 975
            last_login:
              type: string
              nullable: true
              example: "2025-12-28 13:43:56"

            name_ar:
              type: string
              example: "Esraa abdelrahman Hassanin"
            name_en:
              type: string
              example: "Esraa abdelrahman Hassanin"

            mobile1:
              type: string
              example: "1208530935"
            mobile2:
              type: string
              nullable: true
              example: null

            leave_balance:
              type: number
              nullable: true
              example: null

            category_name:
              type: string
              example: "Admin"
            department_name:
              type: string
              example: "Engineering"
            section_name:
              type: string
              nullable: true
              example: null
            position_name:
              type: string
              nullable: true
              example: null

            late_permissions_used:
              type: integer
              example: 0
            late_permissions_allowed:
              type: integer
              example: 2
            late_permissions_remaining:
              type: integer
              example: 2

    ExcuseCreateRequest:
      type: object
      required: [date, type, reason]
      properties:
        date:
          type: string
          format: date
          example: "2026-01-01"
        type:
          type: string
          enum: [come_late, leave_early, absence]
          example: leave_early
        from:
          type: string
          example: "09:00"
        reason:
          type: string
          example: test

    ExcuseCancelRequest:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          example: 64

    ExcuseItem:
      type: object
      properties:
        id:
          type: integer
        permission_date:
          type: string
          format: date
        permission_type:
          type: string
          enum: [come_late, leave_early, absence]
        time_from:
          type: string
        time_to:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, cancelled]
        reason:
          type: string
        created_at:
          type: string

    ExcuseListResponse:
      type: object
      properties:
        status:
          type: boolean
        message:
          type: string
        code:
          type: integer
        data:
          type: array
          items:
            $ref: "#/components/schemas/ExcuseItem"

    RosterResponse:
      type: object
      properties:
        status:
          type: boolean
        data:
          type: object
          properties:
            employee_id:
              type: integer
            period:
              type: object
              properties:
                start:
                  type: string
                  format: date
                end:
                  type: string
                  format: date
            days_count:
              type: integer
            days:
              type: array
              items:
                type: object
                properties:
                  date:
                    type: string
                    format: date
                  type:
                    type: string
                    enum: [shift, leave]
                  shift:
                    nullable: true
                    type: object
                  leave:
                    nullable: true
                    type: object
                  notes:
                    nullable: true
                    type: string

paths:
  /auth/login.php:
    post:
      tags: [Authentication]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200": { description: Login successful }

  /auth/logout.php:
    post:
      tags: [Authentication]
      summary: Logout
      security:
        - BearerAuth: []
      responses:
        "200": { description: Logout successful }

  /user/me.php:
    get:
      tags: [User]
      summary: Get current user profile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile (extended)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMeResponse"

  /user/change_password.php:
    post:
      tags: [User]
      summary: Change password
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200": { description: Password changed }

  /roster/my_schedule.php:
    get:
      tags: [Roster]
      summary: Get my schedule
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterResponse"

  /excuse/my_requests.php:
    get:
      tags: [Excuses]
      summary: Get my excuse requests
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Excuse list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcuseListResponse"

  /excuse/create.php:
    post:
      tags: [Excuses]
      summary: Create excuse request
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExcuseCreateRequest"
      responses:
        "200": { description: Excuse created }

  /excuse/cancel.php:
    post:
      tags: [Excuses]
      summary: Cancel excuse request
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExcuseCancelRequest"
      responses:
        "200": { description: Excuse canceled }
