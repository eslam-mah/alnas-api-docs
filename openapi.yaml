openapi: 3.0.3
info:
  title: Al Nas Hospital HR API
  description: HR system API for authentication, user management, roster, excuses, and leaves
  version: 1.5.0

servers:
  - url: https://172.16.63.95/alnashospital/hr_api
    description: Internal Hospital Network

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ---------- AUTH ----------
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
        new_password:
          type: string

    # ---------- USER ----------
    UserMeResponse:
      type: object
      properties:
        status:
          type: boolean
        data:
          type: object
          properties:
            id: { type: integer }
            username: { type: string }
            display_name: { type: string }
            role: { type: string }
            employee_id: { type: integer }
            employee_number: { type: integer }
            last_login: { type: string, nullable: true }
            name_ar: { type: string }
            name_en: { type: string }
            mobile1: { type: string }
            mobile2: { type: string, nullable: true }
            leave_balance: { type: number, nullable: true }
            category_name: { type: string }
            department_name: { type: string }
            section_name: { type: string, nullable: true }
            position_name: { type: string, nullable: true }
            late_permissions_used: { type: integer }
            late_permissions_allowed: { type: integer }
            late_permissions_remaining: { type: integer }

    # ---------- LEAVE ----------
    LeaveCreateRequest:
      type: object
      required: [leave_type_id, date_from, date_to, reason]
      properties:
        leave_type_id:
          type: integer
          example: 3
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        reason:
          type: string

    LeaveCancelRequest:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          example: 15

    LeaveType:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: string
        is_paid:
          type: integer
          enum: [0, 1]
        color:
          type: string
        label:
          type: string

    LeaveTypesResponse:
      type: object
      properties:
        status:
          type: boolean
        message:
          type: string
        code:
          type: integer
        data:
          type: array
          items:
            $ref: "#/components/schemas/LeaveType"

    LeaveRequestItem:
      type: object
      properties:
        id:
          type: integer
        leave_type_id:
          type: integer
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        days_count:
          type: integer
        status:
          type: string
          enum: [pending, approved, rejected, cancelled]
        period_id:
          type: integer
        reason:
          type: string

    LeaveMyRequestsResponse:
      type: object
      properties:
        status:
          type: boolean
        message:
          type: string
        code:
          type: integer
        data:
          type: array
          items:
            $ref: "#/components/schemas/LeaveRequestItem"

    # ---------- EXCUSE ----------
    ExcuseCreateRequest:
      type: object
      required: [date, type, reason]
      properties:
        date:
          type: string
          format: date
        type:
          type: string
          enum: [come_late, leave_early, absence]
        from:
          type: string
        reason:
          type: string

    ExcuseCancelRequest:
      type: object
      required: [id]
      properties:
        id:
          type: integer

    ExcuseItem:
      type: object
      properties:
        id: { type: integer }
        permission_date: { type: string, format: date }
        permission_type:
          type: string
          enum: [come_late, leave_early, absence]
        time_from: { type: string }
        time_to: { type: string }
        status:
          type: string
          enum: [pending, approved, rejected, cancelled]
        reason: { type: string }
        created_at: { type: string }

    ExcuseListResponse:
      type: object
      properties:
        status: { type: boolean }
        message: { type: string }
        code: { type: integer }
        data:
          type: array
          items:
            $ref: "#/components/schemas/ExcuseItem"

paths:
  # ---------- AUTH ----------
  /auth/login.php:
    post:
      tags: [Authentication]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200": { description: Login successful }

  /auth/logout.php:
    post:
      tags: [Authentication]
      summary: Logout
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Logout successful }

  # ---------- USER ----------
  /user/me.php:
    get:
      tags: [User]
      summary: Get current user profile
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMeResponse"

  /user/change_password.php:
    post:
      tags: [User]
      summary: Change password
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200": { description: Password changed }

  # ---------- LEAVE ----------
  /leave/leaves_types.php:
    get:
      tags: [Leave]
      summary: Get leave types
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Leave types list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveTypesResponse"

  /leave/create.php:
    post:
      tags: [Leave]
      summary: Create leave request
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveCreateRequest"
      responses:
        "200": { description: Leave request created }

  /leave/my_requests.php:
    get:
      tags: [Leave]
      summary: Get my leave requests
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: My leave requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveMyRequestsResponse"

  /leave/cancel.php:
    post:
      tags: [Leave]
      summary: Cancel leave request
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveCancelRequest"
      responses:
        "200": { description: Leave canceled }

  # ---------- EXCUSE ----------
  /excuse/my_requests.php:
    get:
      tags: [Excuses]
      summary: Get my excuse requests
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Excuse list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcuseListResponse"

  /excuse/create.php:
    post:
      tags: [Excuses]
      summary: Create excuse request
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExcuseCreateRequest"
      responses:
        "200": { description: Excuse created }

  /excuse/cancel.php:
    post:
      tags: [Excuses]
      summary: Cancel excuse request
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExcuseCancelRequest"
      responses:
        "200": { description: Excuse canceled }
